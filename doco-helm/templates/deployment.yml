apiVersion: apps/v1
kind: Deployment
metadata:
  name: docosaurus-webapp-deployment
  namespace: {{ .Values.namespace }}
  labels: 
    app: docosaurus-webapp
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: docosaurus-webapp
  template:
    metadata:
      labels:
        app: docosaurus-webapp
    spec:
      containers:
        - name: docosaurus-webapp
          image: harbor.sch.bme.hu/personal-valentin/docosaurus:{{ .Values.tag }}
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 100m
              memory: 150Mi
      imagePullSecrets:
        - name: harbor-registry
