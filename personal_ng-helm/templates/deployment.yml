apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-ng-webapp-deployment
  namespace: {{ .Values.namespace }}
  labels: 
    app: personal-ng-webapp
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: personal-ng-webapp
  template:
    metadata:
      labels:
        app: personal-ng-webapp
    spec:
      containers:
        - name: personal-ng-webapp
          image: harbor.sch.bme.hu/personal-valentin/personal-ng-webapp:{{ .Values.tag }}
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 200m
              memory: 200Mi
            limits:
              cpu: 350m
              memory: 400Mi
          envFrom:
            - secretRef:
                name: personal-ng-webapp-secrets
      imagePullSecrets:
        - name: harbor-registry
