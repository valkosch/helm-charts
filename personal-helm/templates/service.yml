apiVersion: v1
kind: Service
metadata:
  name: personal-webapp-service
  namespace: {{ .Values.namespace }}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: valkoweb.lan
spec:
  selector:
    app: personal-webapp
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer
